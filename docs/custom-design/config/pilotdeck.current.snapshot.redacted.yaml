# 讨论开始时的 PilotDeck 配置快照（密钥已脱敏）
schemaVersion: 1
agent:
  model: deepseek/deepseek-v4-pro
  params: {}
  subagents:
    default: inherit
    params: {}
  maxContextTokens: 400000
  maxOutputTokens: 384000

model:
  providers:
    deepseek:
      protocol: openai
      url: https://api.deepseek.com
      apiKey: ${DEEPSEEK_API_KEY}
      timeoutMs: 120000
      models:
        deepseek-chat: {}
        deepseek-v4-pro:
          multimodal:
            input: [text, image]
        deepseek-v4-flash: {}
    dashscope:
      protocol: openai
      url: https://dashscope.aliyuncs.com/compatible-mode/v1
      apiKey: ${DASHSCOPE_API_KEY}
      models:
        qwen3.7-plus: {}
        qwen3.7-max: {}
        qwen3.6-flash: {}
    volc_ark:
      protocol: openai
      url: https://ark.cn-beijing.volces.com/api/v3
      apiKey: ${VOLC_ARK_API_KEY}
      models:
        doubao-seed-2-1-pro-260628: {}
        doubao-seed-2-1-turbo-260628: {}
        doubao-seed-2-0-lite-260428: {}

memory:
  enabled: true
  reasoningMode: answer_first
  autoIndexIntervalMinutes: 30
  autoDreamIntervalMinutes: 60
  captureStrategy: last_turn
  includeAssistant: true
  maxMessageChars: 6000
  heartbeatBatchSize: 30

webui:
  runtime:
    host: 0.0.0.0
    serverPort: 3001
    vitePort: 5173
    apiTimeoutMs: 120000
    databasePath: /home/simon/.pilotdeck/auth.db
    workspacesRoot: /home/simon
  officePreview:
    service: libreoffice
    binaryPath: ""

telemetry:
  enabled: false

adapters:
  feishu:
    enabled: false
    appId: ""
    appSecret: ""
  weixin:
    enabled: true

router:
  enabled: true
  scenarios:
    default: deepseek/deepseek-v4-pro
  fallback:
    default:
      - deepseek/deepseek-v4-pro
  zeroUsageRetry:
    enabled: true
    maxAttempts: 2
  tokenSaver:
    enabled: true
    judge: deepseek/deepseek-v4-flash
    defaultTier: medium
    judgeTimeoutMs: 15000
    tiers:
      simple:
        model: deepseek/deepseek-v4-flash
        description: Simple greetings, confirmations, single-step Q&A, trivial file writes, remembering rules
      medium:
        model: deepseek/deepseek-v4-flash
        description: Single tool call, short text generation, 1-2 file read/write, code generation
      complex:
        model: deepseek/deepseek-v4-pro
        description: Needs sub-agent orchestration: parallel workstreams, delegation to specialized agents
      reasoning:
        model: deepseek/deepseek-v4-pro
        description: Deep single-agent work: multi-file operations, data analysis, multi-step workflows, web research, structured reports from many sources
    rules:
      - complex is ONLY for tasks that need sub-agent orchestration or parallel delegation — do NOT use it for single-agent multi-step work
      - Multi-file operations, data analysis, and multi-step workflows without orchestration should be reasoning
      - Simple file creation (1-2 files) or single code generation is medium
      - Trivial greetings, confirmations, remembering rules, or reading one file and answering a short question is simple
  autoOrchestrate:
    enabled: true
    triggerTiers: [complex]
    slimSystemPrompt: true
    allowedTools: [agent, read_file, grep, glob, read_skill]
  stats:
    enabled: true

cron:
  enabled: true
  timezone: Asia/Shanghai
  maxConcurrentRuns: 2
  runTimeoutMinutes: 60
